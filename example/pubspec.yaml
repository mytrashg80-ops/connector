name: connector_example
description: Demo del editor de nodos `connector` para una app de inventario.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  connector:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Roboto incluida para que la web no dependa de fonts.gstatic.com.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-400.ttf
        - asset: assets/fonts/Roboto-500.ttf
          weight: 500
        - asset: assets/fonts/Roboto-600.ttf
          weight: 600
        - asset: assets/fonts/Roboto-700.ttf
          weight: 700
